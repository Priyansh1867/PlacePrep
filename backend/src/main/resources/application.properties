server.port=${PORT:8082}

# MySQL is the only supported database profile.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Multipart Upload Limits (Supports Resumes up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ATS Compatibility Checker Configuration
placeprep.resume-ats.approval-threshold=75
# Code execution is deliberately disabled until a real sandbox endpoint is configured.
placeprep.judge0.enabled=${PLACEPREP_JUDGE0_ENABLED:false}
placeprep.judge0.api-url=${PLACEPREP_JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
placeprep.judge0.api-key=${PLACEPREP_JUDGE0_API_KEY:}
placeprep.judge0.api-host=${PLACEPREP_JUDGE0_API_HOST:judge0-ce.p.rapidapi.com}
