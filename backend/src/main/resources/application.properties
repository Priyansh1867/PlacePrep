server.port=${PORT:8082}

# MySQL is the only supported database profile.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Multipart Upload Limits (Supports Resumes up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ATS Compatibility Checker Configuration
placeprep.resume-ats.approval-threshold=75

# Gemini AI configuration. Set GEMINI_API_KEY in the deployment environment.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2
