server.port=8080

# Profile: h2 (default, in-memory) | mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Multipart Upload Limits (10MB Max per resume)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Judge0 is optional; configure the URL and credentials only in the backend environment.
placeprep.judge0.base-url=${JUDGE0_BASE_URL:}
placeprep.judge0.api-key=${JUDGE0_API_KEY:}
placeprep.judge0.api-key-header=${JUDGE0_API_KEY_HEADER:X-Auth-Token}
placeprep.judge0.api-host=${JUDGE0_API_HOST:}
placeprep.judge0.language-java-id=${JUDGE0_LANGUAGE_JAVA_ID:62}
placeprep.judge0.cpu-time-limit=${JUDGE0_CPU_TIME_LIMIT:2.0}
placeprep.judge0.wall-time-limit=${JUDGE0_WALL_TIME_LIMIT:5.0}
placeprep.judge0.memory-limit-kb=${JUDGE0_MEMORY_LIMIT_KB:128000}
placeprep.judge0.queue-timeout-ms=${JUDGE0_QUEUE_TIMEOUT_MS:12000}
placeprep.judge0.source-max-bytes=${JUDGE0_SOURCE_MAX_BYTES:40000}
